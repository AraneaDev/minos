  <text x="26" y="168" xml:space="preserve"><tspan fill="#63707f">  (counts are changes: one Edit, Write or NotebookEdit tool call each, deduplicated by tool_use id; each change has one label below)</tspan></text>
  <text x="26" y="189" xml:space="preserve"><tspan fill="#63707f">  (+/- are not diff lines: an Edit counts its whole old and new strings, a Write counts its whole content with 0 removed)</tspan></text>
