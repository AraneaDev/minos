  <text x="26" y="630" xml:space="preserve"><tspan fill="#b8c0cb">    2  </tspan><tspan fill="#63707f">22:50</tspan><tspan fill="#b8c0cb">         1 file   +  10  -   6  "Use a </tspan><tspan fill="#9a8fd0">subagent</tspan><tspan fill="#b8c0cb"> (the Agent tool) to add d"       0</tspan></text>
