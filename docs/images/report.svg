<svg xmlns="http://www.w3.org/2000/svg" width="1161" height="730" viewBox="0 0 1161 730" font-family="ui-monospace, SFMono-Regular, &#34;SF Mono&#34;, Menlo, Consolas, &#34;DejaVu Sans Mono&#34;, monospace" font-size="14">
