  <text x="26" y="231" xml:space="preserve"><tspan fill="#b8c0cb">  </tspan><tspan fill="#7fb3a3">decided</tspan><tspan fill="#b8c0cb">       0 changes  +   0  -   0   </tspan><tspan fill="#7fb3a3">you were asked before it was applied</tspan></text>
