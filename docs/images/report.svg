  <text x="26" y="504" xml:space="preserve"><tspan fill="#b8c0cb">  /tmp/minos-demo/src/checkout.ts          </tspan><tspan fill="#cf6a63">overwritten</tspan><tspan fill="#b8c0cb">  </tspan><tspan fill="#63707f">22:51</tspan><tspan fill="#b8c0cb">      prompt 3       to </tspan><tspan fill="#63707f">22:52</tspan><tspan fill="#b8c0cb">      prompt 5      </tspan></text>
